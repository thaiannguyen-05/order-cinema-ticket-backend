global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: telegram-default
  routes:
    - matchers:
        - severity = "critical"
      receiver: telegram-default
      continue: false
    - matchers:
        - severity = "warning"
      receiver: telegram-default

receivers:
  - name: telegram-default
    telegram_configs:
      - bot_token: 'REPLACE_ME_TELEGRAM_BOT_TOKEN'
        chat_id: -123456789
        message: |
          {{ if eq .Status "firing" }}🔥 FIRING{{ else }}✅ RESOLVED{{ end }}
          <b>{{ .CommonLabels.alertname }}</b> [{{ .CommonLabels.severity }}]
          {{ range .Alerts -}}
          • {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
        parse_mode: HTML
